# Installed Lead-read defaults, not executable Orca config. Checked locally on 2026-09-14.
version: 2
families: {codex: openai, claude: anthropic}

# Host-local availability switches; route preferences stay intact while OFF.
providers:
  codex: {enabled: true}
  claude: {enabled: true}

# Default identifiers live here. Host overrides may replace route leaves.
# No [1m] tag: measured, these models already report contextWindow 1000000 without
# it. The tag only moves models whose registry window is 200000, such as sonnet-4-6.
lead:
  primary: {agent: codex, model: gpt-6-astra, effort: xhigh}
  fallback: {agent: claude, model: claude-fable-5-1, effort: medium}

roles:
  architect:
    primary: {agent: claude, model: claude-fable-5-1, effort: medium}
    fallback: {agent: claude, model: claude-opus-5-5, effort: high}
  engineer:
    primary: {agent: codex, model: gpt-6-sol, effort: high}
    fallback: {agent: claude, model: claude-opus-5-5, effort: high}
  researcher:
    primary: {agent: codex, model: gpt-6-sol, effort: high}
    fallback: {agent: claude, model: claude-opus-5-5, effort: high}
  reviewer:
    # Same-family routes permit independent review when the opposite family is unavailable.
    by_maker_family:
      openai:
        primary: {agent: claude, model: claude-fable-5-1, effort: medium}
        fallback: {agent: claude, model: claude-opus-5-5, effort: high}
        same_family_fallback: {agent: codex, model: gpt-6-astra, effort: high}
      anthropic:
        primary: {agent: codex, model: gpt-6-astra, effort: high}
        fallback: {agent: codex, model: gpt-6-sol, effort: high}
        same_family_fallback: {agent: claude, model: claude-fable-5-1, effort: medium}

# Used only when HARD/CRITICAL justifies independent solution lanes.
competition:
  lanes:
    primary_family:
      primary: {agent: codex, model: gpt-6-sol, effort: high}
      fallback: {agent: codex, model: gpt-6-astra, effort: high}
    alternate_family:
      primary: {agent: claude, model: claude-opus-5-5, effort: high}
      fallback: {agent: claude, model: claude-fable-5-1, effort: medium}

revision_rounds: 2
